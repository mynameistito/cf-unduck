name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - typecheck
          - test
          - check
          - build
    name: ${{ matrix.task }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          # Bun's cache can contain platform-specific native modules (for
          # example, LightningCSS). Avoid restoring artifacts from another OS.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run task
        run: bun run ${{ matrix.task }}

      - name: Build Worker Preview artifact
        if: matrix.task == 'build'
        run: |
          mkdir -p "$RUNNER_TEMP/alchemy-worker/worker" "$RUNNER_TEMP/alchemy-worker/site"
          bun build src/worker.ts --target browser --outfile "$RUNNER_TEMP/alchemy-worker/worker/index.js"
          cp -R dist/. "$RUNNER_TEMP/alchemy-worker/site/"

      - name: Upload Worker Preview artifact
        if: matrix.task == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alchemy-worker
          path: ${{ runner.temp }}/alchemy-worker/
          if-no-files-found: error

  validate:
    name: Validate
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all checks passed
        run: echo "All required checks passed."
