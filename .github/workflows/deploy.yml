name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      reconcile:
        description: Destroy preview stages whose pull requests are no longer open
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request' && github.event.action == 'closed') || (github.event_name == 'workflow_dispatch' && inputs.reconcile == true)
    runs-on: ubuntu-24.04
    concurrency:
      group: alchemy-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || github.event_name == 'workflow_dispatch' && 'reconcile' || 'invalid' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Run Alchemy deployment
        # Pin the published action release immutably.
        uses: mynameistito/alchemy-deploy@b20fd626080d4db521884f96d70b15471de493ab # v3.1.4
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: cf-unduck
          deploy-command: bun ./node_modules/alchemy/bin/cli.js deploy --stage "$STAGE" --yes
          destroy-command: bun ./node_modules/alchemy/bin/cli.js destroy --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://search.mynameistito.com
          use-adopt: false
          preview-artifact: alchemy-worker
          preview-entrypoint: worker/index.js
          preview-assets-directory: site
          preview-assets-config: '{"notFoundHandling":"single-page-application","runWorkerFirst":true}'
          preview-compatibility-date: "2026-06-10"
          reconcile: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile }}
