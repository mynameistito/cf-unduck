name: Daily bang refresh

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Fetch + regenerate bangs
        run: bun run fetch-bangs

      - name: Format generated files
        run: bun run fix

      - name: Validate generated files
        run: |
          bun run typecheck
          bun run check
          bun test
          bun run build

      - name: Create update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/update-bangs"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/lib/bangs/hashbang.ts

          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update bangs.json"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_sha="$(git ls-remote --heads "${remote_url}" "${branch}" | cut -f1)"

          if [ -z "${remote_sha}" ]; then
            git push "${remote_url}" "HEAD:${branch}"
          else
            git push --force-with-lease="refs/heads/${branch}:${remote_sha}" "${remote_url}" "HEAD:${branch}"
          fi

          pr_number="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"

          if [ -z "${pr_number}" ]; then
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: update bangs.json" \
              --body "Automated refresh of the generated Kagi bangs data."
          else
            gh pr edit "${pr_number}" \
              --title "chore: update bangs.json" \
              --body "Automated refresh of the generated Kagi bangs data."
          fi

          gh workflow run ci.yml --ref "${branch}"
          gh workflow run codeql.yml --ref "${branch}"
