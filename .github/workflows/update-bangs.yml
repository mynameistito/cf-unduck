name: Daily bang refresh

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Fetch + regenerate bangs
        run: bun run fetch-bangs

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/lib/bangs/bangs.json src/lib/bangs/hashbang.ts

          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi

          git switch --create automation/update-bangs
          git commit -m "chore: update bangs.json"
          git push --force-with-lease origin automation/update-bangs

          gh pr list \
            --head automation/update-bangs \
            --state open \
            --json number \
            --jq 'length > 0' | grep -q true || gh pr create \
            --base main \
            --head automation/update-bangs \
            --title "chore: update bangs.json" \
            --body "Automated bang data refresh." \
            --label automated \
            --label bangs

          gh pr merge automation/update-bangs --auto --squash
