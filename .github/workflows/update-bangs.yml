name: Refresh bangs

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Fetch + regenerate bangs
        run: bun run fetch-bangs

      - name: Format generated files
        run: bun run fix

      - name: Validate
        run: |
          bun run typecheck
          bun run check
          bun test
          bun run build

      - name: Create update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/update-bangs"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/lib/bangs/hashbang.ts

          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update bangs.json"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}" --force

          if ! gh pr list --head "${branch}" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: update bangs.json" \
              --body "Automated refresh of the generated Kagi bangs data."
          fi
